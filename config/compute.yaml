# Compute-Modi (P12/P19) — Default: sovereign (Ollama lokal/LAN)
# Aliase verweisen auf LiteLLM model_name in config/litellm-config.yaml
modes:
  sovereign:
    default_model: ai-os-sovereign
    label: "Lokal (LAN)"
    description: "Ollama auf LAN — kein Cloud-Key nötig"
  balanced:
    default_model: ai-os-balanced
    label: "Cloud (Free)"
    description: "Nemotron Super 120B — OpenRouter :free, 262K, Tools"
  premium:
    default_model: ai-os-premium
    label: "Frontier (Free)"
    description: "Nemotron Ultra 550B — OpenRouter :free, 1M Context, Tools"
  coding:
    default_model: ai-os-coding
    label: "Coding (Free)"
    description: "Poolside Laguna M.1 — OpenRouter :free, agentic coding"

default_mode: sovereign
