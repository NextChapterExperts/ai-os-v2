id: compute-llm-002
name: balanced — Chat routet zu ai-os-balanced
category: llm_inference
endpoint: orchestrator
method: POST
path: /v1/chat/completions
setup:
  path: /v1/compute/mode
  method: POST
  body:
    mode: balanced
body:
  messages:
    - role: user
      content: "Antworte mit genau einem Wort: OK"
  max_tokens: 15
  persist: false
  tenant_id: nextchapter
expect:
  http_status: 200
  compute_mode: balanced
  model: ai-os-balanced
  source_in:
    - litellm
  has_content_or_raw: true
