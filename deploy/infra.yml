# deploy/infra.yml — Phase-0 Baseline (von allen Modi included)
services:
  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres-platform:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aios}
      POSTGRES_USER: ${POSTGRES_USER:-aios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_platform_data:/var/lib/postgresql/data
      - ../config/init-platform.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aios} -d ${POSTGRES_DB:-aios}"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-letta:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: letta
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: letta
    volumes: ["postgres_letta_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta -d letta"]
      interval: 5s
      timeout: 5s
      retries: 20

  letta:
    restart: unless-stopped
    # lettaai/letta:latest (2026-07) bricht mit fehlendem psycopg2 bei PG-URI —
    # Phase 0: SQLite-Persistenz; PG-Anbindung später pinnen
    image: lettaai/letta:latest
    ports: ["8283:8283"]
    volumes: ["letta_data:/root/.letta"]
    environment:
      # Agents werden per API mit OLLAMA_HOST aus .env angelegt (letta_client.py)
      OLLAMA_HOST: ${OLLAMA_HOST:-192.168.178.64}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # postgres-letta bleibt für späteren Wechsel vorbereitet

  litellm:
    restart: unless-stopped
    image: ghcr.io/berriai/litellm:main-latest
    ports: ["${LITELLM_PORT:-4000}:4000"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-192.168.178.64}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      OLLAMA_API_BASE: http://${OLLAMA_HOST:-192.168.178.64}:${OLLAMA_PORT:-11434}/v1
    volumes:
      - ../config/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  searxng:
    restart: unless-stopped
    image: searxng/searxng:latest
    ports: ["8888:8080"]
    volumes:
      - ../config/searxng:/etc/searxng:rw

volumes:
  qdrant_data:
  postgres_platform_data:
  postgres_letta_data:
  letta_data:
